<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawForge / ClawScope — UX 方向示意</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #0f172a; }
    .tb { height: 40px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 8px; font-size: 13px; }
    .tb .logo { width: 28px; height: 28px; background: linear-gradient(135deg, #0ea5e9, #38bdf8); border-radius: 6px; margin-right: 8px; }
    .tb .drag { flex: 1; color: #334155; }
    .tb .win { width: 46px; height: 40px; border: none; background: transparent; cursor: default; }
    .layout { display: flex; height: calc(100vh - 41px); }
    .nav { width: 220px; background: #fff; border-right: 1px solid #e2e8f0; padding: 12px 0; }
    .nav a { display: block; padding: 10px 16px; color: #0f172a; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
    .nav a.active { background: #f0f9ff; border-left-color: #0ea5e9; font-weight: 600; }
    .main { flex: 1; padding: 16px 20px; overflow: auto; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar input { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; min-width: 200px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font-size: 13px; cursor: default; }
    .btn-primary { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; font-weight: 600; color: #475569; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .note { font-size: 12px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="tb">
    <div class="logo" title="logo"></div>
    <div class="drag">ClawScope — 记忆可见，进化可期</div>
    <button type="button" class="win" aria-label="min">—</button>
    <button type="button" class="win" aria-label="max">□</button>
    <button type="button" class="win" aria-label="close">×</button>
  </div>
  <div class="layout">
    <aside class="nav">
      <a href="#" class="active">记忆</a>
      <a href="#">配置</a>
      <a href="#">进化</a>
    </aside>
    <main class="main">
      <h2>方向 A · 工作台（MVP 主界面）</h2>
      <div class="toolbar">
        <input type="search" placeholder="搜索记忆…" />
        <button type="button" class="btn">表格视图</button>
        <button type="button" class="btn">每日足迹</button>
        <button type="button" class="btn-primary">筛选</button>
      </div>
      <table>
        <thead>
          <tr><th>时间</th><th>类型 / 来源</th><th>Agent</th><th>摘要</th></tr>
        </thead>
        <tbody>
          <tr><td>2026-03-24 10:00</td><td>MEMORY.md</td><td>default</td><td>示例记忆条目…</td></tr>
          <tr><td>2026-03-24 09:30</td><td>日记</td><td>agent-b</td><td>…</td></tr>
        </tbody>
      </table>
      <p class="note">静态示意：与 PRD 表格视图（FR2）一致；侧栏对应 FR16 三入口。</p>
    </main>
  </div>
</body>
</html>

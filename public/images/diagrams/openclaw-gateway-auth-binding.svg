<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Gateway binding and authentication flow</title>
  <desc id="desc">A client reaches OpenClaw Gateway through a LAN URL, the Gateway listens on a bind mode, then applies token, password, none, or trusted proxy authentication before exposing OpenClaw runtime access.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa" />
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="32" fill="#0f172a" />
  <circle cx="810" cy="90" r="150" fill="#1e40af" opacity="0.24" />
  <circle cx="130" cy="470" r="160" fill="#0f766e" opacity="0.2" />
  <text x="52" y="64" fill="#f8fafc" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700">OpenClaw Gateway 配置路径</text>
  <text x="52" y="94" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="15">先确认监听范围，再选择认证方式；ClawScope 只在网络与 WebSocket 握手成功后才进入 token / password 验证。</text>

  <g filter="url(#softShadow)">
    <rect x="58" y="150" width="190" height="126" rx="22" fill="url(#panel)" stroke="#93c5fd" stroke-width="2" />
    <text x="86" y="188" fill="#0f172a" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="19" font-weight="700">ClawScope 客户端</text>
    <text x="86" y="219" fill="#475569" font-family="Consolas, Monaco, monospace" font-size="15">http://LAN-IP:18789</text>
    <text x="86" y="246" fill="#475569" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">测试 TCP / WebSocket</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="382" y="124" width="220" height="178" rx="24" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
    <text x="424" y="164" fill="#f8fafc" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700">Gateway 监听层</text>
    <rect x="412" y="188" width="160" height="38" rx="12" fill="#ecfdf5" stroke="#10b981" />
    <text x="445" y="213" fill="#065f46" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="700">bind = lan</text>
    <text x="420" y="252" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">0.0.0.0:18789</text>
    <text x="420" y="276" fill="#94a3b8" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="13">loopback 仅本机可访问</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="718" y="112" width="190" height="202" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="2" />
    <text x="756" y="153" fill="#f8fafc" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700">认证层</text>
    <rect x="748" y="176" width="130" height="30" rx="10" fill="#dbeafe" />
    <text x="787" y="197" fill="#1e40af" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700">token</text>
    <rect x="748" y="216" width="130" height="30" rx="10" fill="#fef3c7" />
    <text x="776" y="237" fill="#92400e" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700">password</text>
    <rect x="748" y="256" width="130" height="30" rx="10" fill="#f3f4f6" />
    <text x="794" y="277" fill="#374151" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700">none</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="382" y="382" width="526" height="104" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="424" y="423" fill="#0f172a" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="20" font-weight="700">OpenClaw Runtime</text>
    <text x="424" y="453" fill="#475569" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">记忆、进化、Agent 配置与文件访问都在认证通过后开放。</text>
  </g>

  <path d="M 250 213 C 296 213 330 213 376 213" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 604 213 C 648 213 672 213 714 213" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)" />
  <path d="M 813 318 C 813 360 756 394 700 421" fill="none" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)" />

  <g>
    <rect x="72" y="350" width="228" height="136" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="99" y="386" fill="#f8fafc" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="18" font-weight="700">切换时的最小闭环</text>
    <text x="99" y="418" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">1. jq 修改 openclaw.json</text>
    <text x="99" y="446" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">2. 重启 Gateway</text>
    <text x="99" y="474" fill="#cbd5e1" font-family="Segoe UI, Noto Sans SC, Arial, sans-serif" font-size="14">3. ClawScope 重新测试连接</text>
  </g>
</svg>

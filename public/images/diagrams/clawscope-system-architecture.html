<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClawScope 系统架构图预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #cbd5e1;
        --panel: #111827;
        --line: #334155;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 85% 8%, rgb(30 64 175 / 0.24), transparent 24rem),
          radial-gradient(circle at 10% 90%, rgb(15 118 110 / 0.20), transparent 26rem),
          var(--bg);
        color: var(--fg);
        font-family: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }
      main {
        width: min(1280px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      section {
        margin-top: 24px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgb(17 24 39 / 0.72);
        box-shadow: 0 24px 80px rgb(2 6 23 / 0.42);
      }
      h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 24px;
      }
      code {
        color: #bfdbfe;
        font-family: Consolas, Monaco, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>ClawScope 系统架构图预览</h1>
        <p>
          README 使用两张语言专属 SVG：英文版 <code>clawscope-system-architecture-en.svg</code>，
          中文版 <code>clawscope-system-architecture-zh.svg</code>。旧的
          <code>clawscope-system-architecture.svg</code> 保留为英文兼容入口。
        </p>
      </header>

      <section>
        <h2>English</h2>
        <img src="./clawscope-system-architecture-en.svg" alt="ClawScope system architecture" />
      </section>

      <section>
        <h2>中文</h2>
        <img src="./clawscope-system-architecture-zh.svg" alt="ClawScope 系统架构图" />
      </section>
    </main>
  </body>
</html>

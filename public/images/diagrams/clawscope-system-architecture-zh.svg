<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">ClawScope 系统架构图</title>
  <desc id="desc">ClawScope 由 React 视图层、Tauri 命令桥、Rust 本地能力、OpenClaw Gateway 与本地 JSON 状态存储组成。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.24"/>
    </filter>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="warmPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .canvas { fill: #0f172a; }
      .title { font: 750 30px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.4px; }
      .subtitle { font: 500 15px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .boundary-label { font: 750 14px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0.1px; }
      .box-title-dark { font: 750 14px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .box-title-light { font: 750 14px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #f8fafc; }
      .box-text-dark { font: 600 12.5px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #475569; }
      .box-text-light { font: 600 12.5px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .box-accent-dark { font: 700 11.2px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #1e40af; }
      .box-accent-light { font: 700 11.2px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #bfdbfe; }
      .mono-dark { font: 700 12px Consolas, Monaco, monospace; fill: #1e40af; }
      .mono-light { font: 700 12px Consolas, Monaco, monospace; fill: #bfdbfe; }
      .tiny { font: 500 10px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #64748b; }
      .flow-label { font: 700 11.5px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .legend { font: 650 11.5px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #cbd5e1; }
      .pill { font: 800 10.5px "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="860" rx="32"/>
  <circle cx="1085" cy="110" r="170" fill="#1e40af" opacity="0.24"/>
  <circle cx="135" cy="690" r="185" fill="#0f766e" opacity="0.20"/>
  <circle cx="640" cy="92" r="120" fill="#0369a1" opacity="0.12"/>

  <circle cx="72" cy="54" r="7" fill="#60a5fa"/>
  <text class="title" x="92" y="64">ClawScope 系统架构</text>
  <text class="subtitle" x="92" y="90">OpenClaw 记忆可视化、配置管理与进化审计的本地桌面控制面</text>

  <!-- Connection arrows are intentionally drawn before component boxes. -->
  <line x1="188" y1="343" x2="248" y2="343" stroke="#60a5fa" stroke-width="2.6" marker-end="url(#arrowCyan)"/>
  <path d="M 480 250 L 516 250 L 516 302 L 548 302" fill="none" stroke="#60a5fa" stroke-width="2.3" marker-end="url(#arrowCyan)"/>
  <line x1="480" y1="360" x2="548" y2="360" stroke="#60a5fa" stroke-width="2.3" marker-end="url(#arrowCyan)"/>
  <path d="M 652 322 L 672 322 L 672 264 L 698 264" fill="none" stroke="#10b981" stroke-width="2.3" marker-end="url(#arrowEmerald)"/>
  <path d="M 652 360 L 672 360 L 672 579 L 698 579" fill="none" stroke="#10b981" stroke-width="2.3" marker-end="url(#arrowEmerald)"/>
  <path d="M 880 579 L 895 579 L 895 264 L 880 264" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6,6" marker-end="url(#arrowEmerald)"/>
  <line x1="900" y1="260" x2="994" y2="260" stroke="#10b981" stroke-width="2.6" marker-end="url(#arrowEmerald)"/>
  <path d="M 880 468 L 930 468 L 930 283 L 995 283" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrowRose)"/>
  <line x1="800" y1="608" x2="800" y2="626" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <path d="M 700 483 L 600 483 L 600 626" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="370" y1="532" x2="370" y2="586" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrowViolet)"/>
  <path d="M 1097 302 L 1097 334" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <path d="M 1097 392 L 1097 425" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>
  <path d="M 1097 510 L 1097 538" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrowhead)"/>

  <!-- Boundary boxes. -->
  <rect x="220" y="118" width="710" height="595" rx="22" fill="#111827" fill-opacity="0.72" stroke="#38bdf8" stroke-width="2"/>
  <text class="boundary-label" x="240" y="143" fill="#bfdbfe">ClawScope 桌面应用 / Tauri 2 运行时</text>

  <rect x="245" y="165" width="260" height="440" rx="18" fill="#e0f2fe" fill-opacity="0.08" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text class="boundary-label" x="265" y="189" fill="#bfdbfe">React 界面层</text>

  <rect x="675" y="165" width="230" height="440" rx="18" fill="#064e3b" fill-opacity="0.16" stroke="#10b981" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text class="boundary-label" x="695" y="189" fill="#bbf7d0">Rust 核心层</text>

  <rect x="965" y="165" width="265" height="470" rx="20" fill="#1e293b" fill-opacity="0.72" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,5"/>
  <text class="boundary-label" x="985" y="189" fill="#cbd5e1">外部 OpenClaw 运行时</text>

  <!-- Operator. -->
  <g filter="url(#softShadow)">
    <rect x="55" y="302" width="132" height="82" rx="16" fill="url(#panel)" stroke="#93c5fd" stroke-width="2"/>
    <text class="box-title-dark" x="121" y="331" text-anchor="middle">操作者</text>
    <text class="box-text-dark" x="121" y="352" text-anchor="middle">搜索 / 审计 / 配置</text>
    <text class="box-accent-dark" x="121" y="371" text-anchor="middle">桌面工作台</text>
  </g>

  <!-- Frontend layer. -->
  <g filter="url(#softShadow)">
    <rect x="270" y="210" width="210" height="72" rx="15" fill="url(#panel)" stroke="#93c5fd" stroke-width="2"/>
    <text class="box-title-dark" x="375" y="236" text-anchor="middle">外壳与路由</text>
    <text class="box-text-dark" x="375" y="255" text-anchor="middle">Profile / Memory / Config</text>
    <text class="box-accent-dark" x="375" y="272" text-anchor="middle">进化视图</text>

    <rect x="270" y="318" width="210" height="90" rx="15" fill="url(#panel)" stroke="#93c5fd" stroke-width="2"/>
    <text class="box-title-dark" x="375" y="344" text-anchor="middle">OpenClawContext</text>
    <text class="box-text-dark" x="375" y="363" text-anchor="middle">连接状态 / 心跳 / 会话列表</text>
    <text class="box-text-dark" x="375" y="382" text-anchor="middle">局域网发现 / 已保存端点</text>
    <text class="box-accent-dark" x="375" y="399" text-anchor="middle">统一前端命令入口</text>

    <rect x="270" y="444" width="210" height="88" rx="15" fill="url(#panel)" stroke="#93c5fd" stroke-width="2"/>
    <text class="box-title-dark" x="375" y="470" text-anchor="middle">领域面板</text>
    <text class="box-text-dark" x="375" y="489" text-anchor="middle">记忆搜索 / 知识图谱 / 足迹</text>
    <text class="box-text-dark" x="375" y="508" text-anchor="middle">Agent 设置 / 配置 schema</text>
    <text class="box-accent-dark" x="375" y="525" text-anchor="middle">进化预览与审计报告</text>

    <rect x="270" y="586" width="210" height="58" rx="15" fill="#4c1d95" fill-opacity="0.78" stroke="#a78bfa" stroke-width="2"/>
    <text class="box-title-light" x="375" y="611" text-anchor="middle">浏览器 localStorage</text>
    <text class="mono-light" x="375" y="630" text-anchor="middle">URL / 认证模式 / 设置标记</text>
  </g>

  <!-- IPC bridge. -->
  <g filter="url(#softShadow)">
    <rect x="548" y="285" width="104" height="98" rx="16" fill="url(#warmPanel)" stroke="#f59e0b" stroke-width="2"/>
    <text class="box-title-dark" x="600" y="315" text-anchor="middle">Tauri IPC</text>
    <text class="mono-dark" x="600" y="335" text-anchor="middle">invoke(...)</text>
    <text class="mono-dark" x="600" y="353" text-anchor="middle">gateway_*</text>
    <text class="mono-dark" x="600" y="371" text-anchor="middle">evolution_*</text>
  </g>

  <!-- Rust layer. -->
  <g filter="url(#softShadow)">
    <rect x="700" y="220" width="180" height="88" rx="15" fill="#064e3b" fill-opacity="0.72" stroke="#10b981" stroke-width="2"/>
    <text class="box-title-light" x="790" y="246" text-anchor="middle">Gateway 编排器</text>
    <text class="box-text-light" x="790" y="266" text-anchor="middle">命令与连接器</text>
    <text class="box-accent-light" x="790" y="285" text-anchor="middle">WebSocket RPC / 方法</text>

    <rect x="700" y="340" width="180" height="74" rx="15" fill="#064e3b" fill-opacity="0.72" stroke="#10b981" stroke-width="2"/>
    <text class="box-title-light" x="790" y="366" text-anchor="middle">会话状态</text>
    <text class="box-text-light" x="790" y="386" text-anchor="middle">活跃会话 / 快照</text>
    <text class="box-accent-light" x="790" y="403" text-anchor="middle">待处理请求路由</text>

    <rect x="700" y="446" width="180" height="74" rx="15" fill="#881337" fill-opacity="0.62" stroke="#fb7185" stroke-width="2"/>
    <text class="box-title-light" x="790" y="472" text-anchor="middle">认证与发现</text>
    <text class="box-text-light" x="790" y="492" text-anchor="middle">设备身份 / 签名器</text>
    <text class="box-accent-light" x="790" y="509" text-anchor="middle">challenge / token fallback</text>

    <rect x="700" y="550" width="180" height="58" rx="15" fill="#064e3b" fill-opacity="0.72" stroke="#10b981" stroke-width="2"/>
    <text class="box-title-light" x="790" y="575" text-anchor="middle">进化引擎</text>
    <text class="box-text-light" x="790" y="594" text-anchor="middle">预览 / 执行 / 回滚</text>
  </g>

  <!-- Local stores. -->
  <g filter="url(#softShadow)">
    <rect x="515" y="626" width="170" height="58" rx="15" fill="#4c1d95" fill-opacity="0.78" stroke="#a78bfa" stroke-width="2"/>
    <text class="box-title-light" x="600" y="651" text-anchor="middle">Gateway 存储</text>
    <text class="mono-light" x="600" y="670" text-anchor="middle">id / tokens / endpoints</text>

    <rect x="715" y="626" width="170" height="58" rx="15" fill="#4c1d95" fill-opacity="0.78" stroke="#a78bfa" stroke-width="2"/>
    <text class="box-title-light" x="800" y="651" text-anchor="middle">Evolution 存储</text>
    <text class="mono-light" x="800" y="670" text-anchor="middle">history / audit / snapshots</text>
  </g>

  <!-- External runtime. -->
  <g filter="url(#softShadow)">
    <rect x="995" y="220" width="205" height="82" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#94a3b8" stroke-width="2"/>
    <text class="box-title-light" x="1098" y="246" text-anchor="middle">OpenClaw Gateway</text>
    <text class="mono-light" x="1098" y="266" text-anchor="middle">ws://host:18789</text>
    <text class="box-accent-light" x="1098" y="285" text-anchor="middle">协议验证端点</text>

    <rect x="995" y="334" width="205" height="60" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#94a3b8" stroke-width="2"/>
    <text class="box-title-light" x="1098" y="359" text-anchor="middle">Agent 注册表</text>
    <text class="box-text-light" x="1098" y="378" text-anchor="middle">agents / identity / workspace</text>

    <rect x="995" y="425" width="205" height="86" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#94a3b8" stroke-width="2"/>
    <text class="box-title-light" x="1098" y="451" text-anchor="middle">记忆运行时</text>
    <text class="box-text-light" x="1098" y="470" text-anchor="middle">MEMORY.md / daily memory</text>
    <text class="box-text-light" x="1098" y="489" text-anchor="middle">语义搜索 / 时间线</text>
    <text class="box-accent-light" x="1098" y="506" text-anchor="middle">索引与诊断</text>

    <rect x="995" y="538" width="205" height="60" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#94a3b8" stroke-width="2"/>
    <text class="box-title-light" x="1098" y="563" text-anchor="middle">配置表面</text>
    <text class="box-text-light" x="1098" y="582" text-anchor="middle">Agent 设置 / config schema</text>
  </g>

  <!-- Flow labels. -->
  <rect x="202" y="322" width="38" height="18" rx="9" fill="#dbeafe"/>
  <text class="pill" x="221" y="335" text-anchor="middle">UI</text>
  <text class="flow-label" x="520" y="278" text-anchor="middle">视图调用上下文</text>
  <text class="flow-label" x="671" y="307" text-anchor="middle">命令</text>
  <text class="flow-label" x="950" y="247" text-anchor="middle">WebSocket RPC</text>
  <text class="flow-label" x="932" y="410" text-anchor="middle" fill="#fecdd3">challenge + signed connect</text>
  <text class="flow-label" x="922" y="542" text-anchor="middle" fill="#bbf7d0">memory get/set/index</text>
  <text class="flow-label" x="625" y="716" text-anchor="middle">本地 JSON 状态保障离线重连、审计与回滚</text>

  <!-- Legend below all boundaries. -->
  <text class="boundary-label" x="72" y="760" fill="#f8fafc">图例</text>
  <rect x="72" y="778" width="18" height="12" rx="3" fill="#e0f2fe" stroke="#93c5fd"/>
  <text class="legend" x="100" y="788">前端</text>
  <rect x="190" y="778" width="18" height="12" rx="3" fill="#064e3b" fill-opacity="0.72" stroke="#10b981"/>
  <text class="legend" x="218" y="788">Rust 后端</text>
  <rect x="338" y="778" width="18" height="12" rx="3" fill="#4c1d95" fill-opacity="0.78" stroke="#a78bfa"/>
  <text class="legend" x="366" y="788">本地存储</text>
  <rect x="484" y="778" width="18" height="12" rx="3" fill="#881337" fill-opacity="0.62" stroke="#fb7185"/>
  <text class="legend" x="512" y="788">认证/安全</text>
  <rect x="648" y="778" width="18" height="12" rx="3" fill="#fff7ed" stroke="#f59e0b"/>
  <text class="legend" x="676" y="788">IPC/运行时边界</text>
  <line x1="850" y1="784" x2="884" y2="784" stroke="#fb7185" stroke-width="2" stroke-dasharray="6,6"/>
  <text class="legend" x="896" y="788">认证流</text>
  <line x1="1012" y1="784" x2="1046" y2="784" stroke="#10b981" stroke-width="2.3" marker-end="url(#arrowEmerald)"/>
  <text class="legend" x="1058" y="788">数据/控制流</text>

  <text class="tiny" x="72" y="826">来源：README 架构说明、src/app/contexts/OpenClawContext.tsx、src-tauri/src/lib.rs、gateway/*、evolution/*</text>
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>

    <title>OpenClaw Gateway 绑定与认证配置图</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #cbd5e1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;

        color: var(--fg);

        box-shadow: 0 24px 80px rgb(15 23 42 / 0.35);

  <body>

      <img src="./openclaw-gateway-auth-binding.svg" alt="OpenClaw Gateway 绑定与认证配置路径图" />

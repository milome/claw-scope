<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">ClawScope 系统架构图</title>
  <desc id="desc">ClawScope 由 React 视图层、Tauri 命令桥、Rust 本地能力、OpenClaw Gateway 与本地 JSON 状态存储组成。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      .canvas { fill: #020617; }
      .grid-bg { fill: url(#grid); }
      .title { font: 700 28px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #f8fafc; letter-spacing: -0.6px; }
      .subtitle { font: 500 13px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #94a3b8; }
      .boundary-label { font: 700 12px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; letter-spacing: 0.4px; }
      .box-title { font: 700 13px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #f8fafc; }
      .box-text { font: 500 10px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #94a3b8; }
      .box-accent { font: 600 9px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; }
      .tiny { font: 500 8px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #94a3b8; }
      .flow-label { font: 600 9px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #cbd5e1; }
      .legend { font: 600 9px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #94a3b8; }
      .pill { font: 700 9px 'JetBrains Mono', 'Noto Sans SC', ui-monospace, monospace; fill: #020617; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="860"/>
  <rect class="grid-bg" width="1280" height="860" opacity="0.9"/>
  <circle cx="72" cy="54" r="7" fill="#22d3ee" filter="url(#softGlow)"/>
  <text class="title" x="92" y="64">ClawScope System Architecture</text>
  <text class="subtitle" x="92" y="88">OpenClaw 记忆可视化、配置管理与进化审计的本地桌面控制面</text>

  <!-- Connection arrows are intentionally drawn before component boxes. -->
  <line x1="188" y1="343" x2="248" y2="343" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 480 250 L 516 250 L 516 302 L 548 302" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <line x1="480" y1="360" x2="548" y2="360" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <path d="M 652 322 L 672 322 L 672 264 L 698 264" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>
  <path d="M 652 360 L 672 360 L 672 579 L 698 579" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowEmerald)"/>
  <path d="M 880 579 L 895 579 L 895 264 L 880 264" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowEmerald)"/>
  <line x1="900" y1="260" x2="994" y2="260" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <path d="M 880 468 L 930 468 L 930 283 L 995 283" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowRose)"/>
  <line x1="800" y1="608" x2="800" y2="626" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <path d="M 700 483 L 600 483 L 600 626" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="532" x2="370" y2="586" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M 1097 302 L 1097 334" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <path d="M 1097 392 L 1097 425" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <path d="M 1097 510 L 1097 538" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrowhead)"/>

  <!-- Boundary boxes. -->
  <rect x="220" y="118" width="710" height="595" rx="18" fill="#0f172a" fill-opacity="0.7" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="9,5"/>
  <text class="boundary-label" x="240" y="142" fill="#fbbf24">ClawScope Desktop App / Tauri 2 runtime</text>

  <rect x="245" y="165" width="260" height="440" rx="14" fill="#083344" fill-opacity="0.2" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text class="boundary-label" x="265" y="188" fill="#22d3ee">React UI Layer</text>

  <rect x="675" y="165" width="230" height="440" rx="14" fill="#064e3b" fill-opacity="0.18" stroke="#34d399" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text class="boundary-label" x="695" y="188" fill="#34d399">Rust Core Layer</text>

  <rect x="965" y="165" width="265" height="470" rx="16" fill="#1e293b" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="8,5"/>
  <text class="boundary-label" x="985" y="189" fill="#cbd5e1">External OpenClaw Runtime</text>

  <!-- Operator. -->
  <rect x="55" y="302" width="132" height="82" rx="10" fill="#1e293b" fill-opacity="0.86" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="box-title" x="121" y="332" text-anchor="middle">Operator</text>
  <text class="box-text" x="121" y="351" text-anchor="middle">搜索 / 审计 / 配置</text>
  <text class="box-accent" x="121" y="370" text-anchor="middle" fill="#94a3b8">桌面工作台</text>

  <!-- Frontend layer. -->
  <rect x="270" y="210" width="210" height="72" rx="8" fill="#083344" fill-opacity="0.48" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="box-title" x="375" y="236" text-anchor="middle">Shell + Router</text>
  <text class="box-text" x="375" y="254" text-anchor="middle">Profile / Memory / Config</text>
  <text class="box-accent" x="375" y="270" text-anchor="middle" fill="#22d3ee">Evolution views</text>

  <rect x="270" y="318" width="210" height="90" rx="8" fill="#083344" fill-opacity="0.48" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="box-title" x="375" y="344" text-anchor="middle">OpenClawContext</text>
  <text class="box-text" x="375" y="363" text-anchor="middle">连接状态 / 心跳 / 会话列表</text>
  <text class="box-text" x="375" y="380" text-anchor="middle">LAN discovery / saved endpoints</text>
  <text class="box-accent" x="375" y="397" text-anchor="middle" fill="#22d3ee">统一前端命令入口</text>

  <rect x="270" y="444" width="210" height="88" rx="8" fill="#083344" fill-opacity="0.48" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="box-title" x="375" y="470" text-anchor="middle">Domain Panels</text>
  <text class="box-text" x="375" y="489" text-anchor="middle">记忆搜索 / 知识图谱 / 足迹</text>
  <text class="box-text" x="375" y="506" text-anchor="middle">Agent 设置 / 配置 schema</text>
  <text class="box-accent" x="375" y="523" text-anchor="middle" fill="#22d3ee">进化预览与审计报告</text>

  <rect x="270" y="586" width="210" height="58" rx="8" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="box-title" x="375" y="611" text-anchor="middle">Browser localStorage</text>
  <text class="box-text" x="375" y="629" text-anchor="middle">URL / auth mode / setup flags</text>

  <!-- IPC bridge. -->
  <rect x="548" y="285" width="104" height="98" rx="10" fill="#78350f" fill-opacity="0.42" stroke="#fbbf24" stroke-width="1.5"/>
  <text class="box-title" x="600" y="315" text-anchor="middle">Tauri IPC</text>
  <text class="box-text" x="600" y="335" text-anchor="middle">invoke(...)</text>
  <text class="box-text" x="600" y="352" text-anchor="middle">gateway_*</text>
  <text class="box-accent" x="600" y="369" text-anchor="middle" fill="#fbbf24">evolution_*</text>

  <!-- Rust layer. -->
  <rect x="700" y="220" width="180" height="88" rx="8" fill="#064e3b" fill-opacity="0.48" stroke="#34d399" stroke-width="1.5"/>
  <text class="box-title" x="790" y="246" text-anchor="middle">Gateway Orchestrator</text>
  <text class="box-text" x="790" y="265" text-anchor="middle">commands + connector</text>
  <text class="box-accent" x="790" y="284" text-anchor="middle" fill="#34d399">WebSocket RPC / methods</text>

  <rect x="700" y="340" width="180" height="74" rx="8" fill="#064e3b" fill-opacity="0.48" stroke="#34d399" stroke-width="1.5"/>
  <text class="box-title" x="790" y="366" text-anchor="middle">Session State</text>
  <text class="box-text" x="790" y="385" text-anchor="middle">active sessions / snapshots</text>
  <text class="box-accent" x="790" y="401" text-anchor="middle" fill="#34d399">pending request router</text>

  <rect x="700" y="446" width="180" height="74" rx="8" fill="#881337" fill-opacity="0.42" stroke="#fb7185" stroke-width="1.5"/>
  <text class="box-title" x="790" y="472" text-anchor="middle">Auth + Discovery</text>
  <text class="box-text" x="790" y="491" text-anchor="middle">device identity / signer</text>
  <text class="box-accent" x="790" y="507" text-anchor="middle" fill="#fb7185">challenge / token fallback</text>

  <rect x="700" y="550" width="180" height="58" rx="8" fill="#064e3b" fill-opacity="0.48" stroke="#34d399" stroke-width="1.5"/>
  <text class="box-title" x="790" y="574" text-anchor="middle">Evolution Engine</text>
  <text class="box-text" x="790" y="592" text-anchor="middle">preview / execute / rollback</text>

  <!-- Local stores. -->
  <rect x="515" y="626" width="170" height="58" rx="8" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="box-title" x="600" y="651" text-anchor="middle">Gateway Store</text>
  <text class="box-text" x="600" y="669" text-anchor="middle">identity / tokens / endpoints</text>

  <rect x="715" y="626" width="170" height="58" rx="8" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
  <text class="box-title" x="800" y="651" text-anchor="middle">Evolution Store</text>
  <text class="box-text" x="800" y="669" text-anchor="middle">history / audit / snapshots</text>

  <!-- External runtime. -->
  <rect x="995" y="220" width="205" height="82" rx="8" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="box-title" x="1098" y="246" text-anchor="middle">OpenClaw Gateway</text>
  <text class="box-text" x="1098" y="265" text-anchor="middle">ws://host:18789</text>
  <text class="box-accent" x="1098" y="284" text-anchor="middle" fill="#94a3b8">protocol verified endpoint</text>

  <rect x="995" y="334" width="205" height="60" rx="8" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="box-title" x="1098" y="359" text-anchor="middle">Agent Registry</text>
  <text class="box-text" x="1098" y="377" text-anchor="middle">agents / identity / workspace</text>

  <rect x="995" y="425" width="205" height="86" rx="8" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="box-title" x="1098" y="451" text-anchor="middle">Memory Runtime</text>
  <text class="box-text" x="1098" y="470" text-anchor="middle">MEMORY.md / daily memory</text>
  <text class="box-text" x="1098" y="487" text-anchor="middle">semantic search / timeline</text>
  <text class="box-accent" x="1098" y="503" text-anchor="middle" fill="#94a3b8">index + diagnostics</text>

  <rect x="995" y="538" width="205" height="60" rx="8" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="box-title" x="1098" y="563" text-anchor="middle">Config Surface</text>
  <text class="box-text" x="1098" y="581" text-anchor="middle">agent settings / config schema</text>

  <!-- Flow labels. -->
  <rect x="202" y="322" width="38" height="18" rx="9" fill="#22d3ee"/>
  <text class="pill" x="221" y="335" text-anchor="middle">UI</text>
  <text class="flow-label" x="520" y="278" text-anchor="middle">views call context</text>
  <text class="flow-label" x="671" y="307" text-anchor="middle">commands</text>
  <text class="flow-label" x="950" y="247" text-anchor="middle">WebSocket RPC</text>
  <text class="flow-label" x="932" y="410" text-anchor="middle" fill="#fb7185">challenge + signed connect</text>
  <text class="flow-label" x="922" y="542" text-anchor="middle" fill="#34d399">memory get/set/index</text>
  <text class="flow-label" x="625" y="716" text-anchor="middle">本地 JSON 状态保障离线重连、审计与回滚</text>

  <!-- Legend below all boundaries. -->
  <text class="boundary-label" x="72" y="760" fill="#f8fafc">Legend</text>
  <rect x="72" y="778" width="18" height="12" rx="3" fill="#083344" fill-opacity="0.48" stroke="#22d3ee"/>
  <text class="legend" x="100" y="788">Frontend</text>
  <rect x="190" y="778" width="18" height="12" rx="3" fill="#064e3b" fill-opacity="0.48" stroke="#34d399"/>
  <text class="legend" x="218" y="788">Rust backend</text>
  <rect x="338" y="778" width="18" height="12" rx="3" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa"/>
  <text class="legend" x="366" y="788">Local store</text>
  <rect x="484" y="778" width="18" height="12" rx="3" fill="#881337" fill-opacity="0.42" stroke="#fb7185"/>
  <text class="legend" x="512" y="788">Security/auth</text>
  <rect x="648" y="778" width="18" height="12" rx="3" fill="#78350f" fill-opacity="0.42" stroke="#fbbf24"/>
  <text class="legend" x="676" y="788">IPC/runtime boundary</text>
  <line x1="850" y1="784" x2="884" y2="784" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text class="legend" x="896" y="788">Auth flow</text>
  <line x1="1012" y1="784" x2="1046" y2="784" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrowEmerald)"/>
  <text class="legend" x="1058" y="788">Data/control flow</text>

  <text class="tiny" x="72" y="826">Source: README architecture overview, src/app/contexts/OpenClawContext.tsx, src-tauri/src/lib.rs, gateway/*, evolution/*</text>
</svg>

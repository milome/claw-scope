name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare frontendDist placeholder
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            printf '<!doctype html><html><body>ci-placeholder</body></html>\n' > dist/index.html
          fi

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      - name: Cargo clippy
        run: cargo clippy --lib -- -D warnings
        working-directory: src-tauri

      - name: Build (Linux smoke)
        run: npm run tauri build
        env:
          CI: true

      - name: Visual baseline regression
        run: npm run visual:ci
        env:
          CI: true
          VISUAL_BASELINE_NAME: ci-baseline

      - name: Upload visual baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-baseline
          path: artifacts/visual-regression/ci-baseline

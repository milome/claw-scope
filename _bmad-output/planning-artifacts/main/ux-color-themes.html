<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClawForge / ClawScope — UX 色板与语义 Token</title>
  <style>
    :root {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-border: #e2e8f0;
      --color-text: #0f172a;
      --color-text-muted: #64748b;
      --color-primary: #0ea5e9;
      --color-primary-contrast: #ffffff;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger: #dc2626;
      --demo-tint: #fef9c3;
      --radius: 8px;
      --space: 8px;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    body { margin: 0; padding: 24px; background: var(--color-bg); color: var(--color-text); }
    h1 { font-size: 1.25rem; margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .swatch {
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      overflow: hidden;
      background: var(--color-surface);
    }
    .swatch .chip { height: 64px; }
    .swatch .meta { padding: 8px 10px; font-size: 12px; color: var(--color-text-muted); }
    .meta strong { display: block; color: var(--color-text); font-size: 13px; }
    section { margin-bottom: 32px; }
    .preview {
      display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
      padding: 16px; background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius);
    }
    .btn-primary {
      background: var(--color-primary); color: var(--color-primary-contrast);
      border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: default;
    }
    .badge-demo { background: var(--demo-tint); border: 1px solid #fde047; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>ClawForge（代号 ClawScope）— 语义色与对比</h1>
  <p style="color: var(--color-text-muted); max-width: 56ch;">
    浅色默认主题。实现时使用 CSS 变量映射，便于后续暗色主题。
  </p>

  <section>
    <h2 style="font-size: 1rem; margin-bottom: 12px;">语义 Token</h2>
    <div class="grid">
      <div class="swatch"><div class="chip" style="background: var(--color-bg)"></div><div class="meta"><strong>--color-bg</strong>页面底</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-surface)"></div><div class="meta"><strong>--color-surface</strong>卡片/面板</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-border)"></div><div class="meta"><strong>--color-border</strong>分割线</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-text)"></div><div class="meta"><strong>--color-text</strong>主文</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-primary)"></div><div class="meta"><strong>--color-primary</strong>主操作</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-success)"></div><div class="meta"><strong>--color-success</strong>成功</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-warning)"></div><div class="meta"><strong>--color-warning</strong>警告</div></div>
      <div class="swatch"><div class="chip" style="background: var(--color-danger)"></div><div class="meta"><strong>--color-danger</strong>错误/删除</div></div>
    </div>
  </section>

  <section>
    <h2 style="font-size: 1rem; margin-bottom: 12px;">组件预览</h2>
    <div class="preview">
      <button type="button" class="btn-primary">保存配置</button>
      <span class="badge-demo">演示数据</span>
      <span style="font-size: 13px; color: var(--color-text-muted);">保存成功 · 已写入工作区</span>
    </div>
  </section>
</body>
</html>
